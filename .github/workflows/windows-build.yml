name: Windows Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

env:
  # Must match services/net-merge/go.mod exactly.
  GO_VERSION: "1.27.3"
  RUST_TOOLCHAIN: "stable"

jobs:
  go-build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify toolchain versions
        shell: pwsh
        run: |
          Write-Host "Go version:"
          go version

      - name: Go dependency resolution
        working-directory: services/net-merge
        shell: pwsh
        run: |
          go mod download
          go mod verify

      - name: Go formatting check
        working-directory: services/net-merge
        shell: pwsh
        run: |
          gofmt -l .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Go static analysis (vet)
        working-directory: services/net-merge
        shell: pwsh
        run: |
          go vet ./...

      - name: Go build
        working-directory: services/net-merge
        shell: pwsh
        run: |
          go build -o net-merge-service.exe .
          if (Test-Path net-merge-service.exe) {
            $hash = (Get-FileHash net-merge-service.exe -Algorithm SHA256).Hash
            Write-Host "Go service binary produced successfully: net-merge-service.exe"
            Write-Host "SHA256: $hash"
          } else {
            Write-Error "Go build did not produce net-merge-service.exe"
            exit 1
          }

      - name: Go unit tests
        working-directory: services/net-merge
        shell: pwsh
        run: |
          go test ./... -count=1 -v

      - name: Upload Go binary artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: net-merge-service
          path: services/net-merge/net-merge-service.exe
          retention-days: 7

  rust-build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust ${{ env.RUST_TOOLCHAIN }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Verify toolchain versions
        shell: pwsh
        run: |
          Write-Host "Rust version:"
          rustc --version
          Write-Host "Cargo version:"
          cargo --version

      - name: Rust workspace check
        shell: pwsh
        run: |
          cargo check --workspace

      - name: Rust unit tests
        shell: pwsh
        run: |
          cargo test --workspace
