name: Windows Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

env:
  # Must match services/net-merge/go.mod exactly.
  GO_VERSION: "1.27.3"
  RUST_TOOLCHAIN: "stable"

jobs:
  go-build-and-test:
    name: Go Service Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify toolchain versions
        shell: pwsh
        run: |
          Write-Host "Go version:"
          go version

      - name: Go dependency resolution
        working-directory: services/net-merge
        shell: pwsh
        run: |
          go mod download
          go mod verify

      - name: Go formatting check
        working-directory: services/net-merge
        shell: pwsh
        run: |
          gofmt -l .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Go static analysis (vet)
        working-directory: services/net-merge
        shell: pwsh
        run: |
          go vet ./...

      - name: Go build
        working-directory: services/net-merge
        shell: pwsh
        run: |
          go build -o net-merge-service.exe .
          if (Test-Path net-merge-service.exe) {
            $hash = (Get-FileHash net-merge-service.exe -Algorithm SHA256).Hash
            Write-Host "Go service binary produced successfully: net-merge-service.exe"
            Write-Host "SHA256: $hash"
          } else {
            Write-Error "Go build did not produce net-merge-service.exe"
            exit 1
          }

      - name: Go unit tests
        working-directory: services/net-merge
        shell: pwsh
        run: |
          go test ./... -count=1 -v

      - name: Upload Go binary artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: net-merge-service
          path: services/net-merge/net-merge-service.exe
          retention-days: 7

  rust-build-and-test:
    name: Rust Workspace Check & Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust ${{ env.RUST_TOOLCHAIN }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Verify toolchain versions
        shell: pwsh
        run: |
          Write-Host "Rust version:"
          rustc --version
          Write-Host "Cargo version:"
          cargo --version

      - name: Rust workspace check
        shell: pwsh
        run: |
          cargo check --workspace

      - name: Rust unit tests
        shell: pwsh
        run: |
          cargo test --workspace

  tauri-desktop-build:
    name: Tauri Desktop Application Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust ${{ env.RUST_TOOLCHAIN }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Build Desktop frontend assets
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm ci
          npm run build

      - name: Build Tauri desktop executable
        shell: pwsh
        run: |
          cargo build --release -p multinet-cybershield-ai-desktop
          $exePath = "target/release/multinet-cybershield-ai.exe"
          if (Test-Path $exePath) {
            $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash
            $len = (Get-Item $exePath).Length
            Write-Host "Desktop binary produced successfully: $exePath ($len bytes)"
            Write-Host "SHA256: $hash"
          } else {
            Write-Error "Cargo release build did not produce $exePath"
            exit 1
          }

      - name: Upload Desktop binary artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app
          path: target/release/multinet-cybershield-ai.exe
          retention-days: 7

  benchmark-lab-qualification:
    name: Benchmark Lab Qualification & Report Verification
    needs: [rust-build-and-test]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust ${{ env.RUST_TOOLCHAIN }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Build netbench-cli
        shell: pwsh
        run: |
          cargo build -p netbench-cli

      - name: Run Benchmark Lab Qualification Suite
        shell: pwsh
        run: |
          .\packaging\test-benchmark-qualification.ps1

      - name: Upload Benchmark Lab Qualification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-lab-qualification-artifacts
          path: |
            artifacts/benchmark/*
          retention-days: 7

  release-engineering:
    name: Windows Packaging & Release Integrity Verification
    needs: [go-build-and-test, rust-build-and-test, tauri-desktop-build, benchmark-lab-qualification]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Go Service binary artifact
        uses: actions/download-artifact@v4
        with:
          name: net-merge-service
          path: services/net-merge

      - name: Download Desktop Application binary artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-app
          path: target/release

      - name: Fetch and verify authentic Wintun driver
        shell: pwsh
        run: |
          .\platform\windows\wintun\fetch-wintun.ps1

      - name: Install WiX Toolset v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version

      - name: Build Windows Installer (MSI)
        shell: pwsh
        run: |
          .\packaging\build-installer.ps1

      - name: Install Python Schema Validation Prerequisites
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Generate Software Bill of Materials (SBOM)
        shell: pwsh
        run: |
          .\packaging\sbom\generate-sbom.ps1

      - name: Verify Code Signatures (Beta Policy)
        shell: pwsh
        run: |
          .\packaging\signing\verify-signatures.ps1 -Policy Beta

      - name: Package Beta Distribution Archive
        shell: pwsh
        run: |
          .\packaging\package-beta.ps1

      - name: Run Package Integrity Test Suite
        shell: pwsh
        run: |
          .\packaging\test-package-integrity.ps1

      - name: Upload Release Package Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-package-nm07-0-1
          path: |
            packaging/output/*
            packaging/staging/*
          retention-days: 7

  msi-runtime-qualification:
    name: Windows Runtime & MSI Lifecycle Qualification
    needs: [release-engineering]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Desktop frontend assets
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm ci
          npm run build

      - name: Download Release Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-package-nm07-0-1
          path: .

      - name: Download Go Service binary artifact
        uses: actions/download-artifact@v4
        with:
          name: net-merge-service
          path: services/net-merge

      - name: Download Desktop Application binary artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-app
          path: target/release

      - name: Stage binaries for qualification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/staging | Out-Null
          Copy-Item services/net-merge/net-merge-service.exe packaging/staging/net-merge-service.exe -Force
          Copy-Item target/release/multinet-cybershield-ai.exe packaging/staging/multinet-cybershield-ai.exe -Force

      - name: Run Desktop Runtime Qualification Test
        shell: pwsh
        run: |
          .\packaging\test-desktop-runtime.ps1

      - name: Run Network Recovery & State Test
        shell: pwsh
        run: |
          .\packaging\test-network-recovery.ps1

      - name: Run MSI Lifecycle Qualification Test
        shell: pwsh
        run: |
          .\packaging\test-installer-lifecycle.ps1

      - name: Aggregate Qualification Test Results (Strict Gate)
        if: always()
        shell: pwsh
        run: |
          .\packaging\aggregate-test-results.ps1 -Strict

      - name: Upload Installer Lifecycle Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-lifecycle-logs
          path: |
            packaging/output/final-qualification-report.json
            packaging/output/lifecycle-logs/*
            packaging/output/desktop-runtime-logs/*
            packaging/output/network-diagnostics/*
          retention-days: 7
